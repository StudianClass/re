<title>완강 축하 선물함 · 스터디언 클래스</title>

<meta property="og:description" content="완강 기념으로 지인에게 선물할 수 있는 20% 할인 쿠폰 2장이 준비됐어요.">

<meta property="og:type" content="website">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* =====================================================================
     ★ 완강자용 선물함 (화면 A) — "졸업식 밤" 네이비 & 골드 ★
     알림톡 링크 형식 (압축형):
       https://studianclass.github.io/re/gift/?k=인강쿠폰1.인강쿠폰2&e=20260905
     - k   : 인강 쿠폰번호 2개를 점(.)으로 연결
     - e   : 유효기간 (YYYYMMDD) ※ 이전 exp= 도 계속 동작 → KST 23:59:59 (완강일 기준, 사람마다 다름)
     ※ 이전 형식(?c1=&c2=&v=)도 계속 동작함
     선물 버튼 클릭 → 수신자 화면 링크 자동 생성·복사
       {reBase}?c=쿠폰번호&e=YYYYMMDD
     ※ 영어독립단어 쿠폰은 이번 버전에서 제외 (되살릴 땐 t=v 분기 그대로 사용 가능)
     ===================================================================== */
  :root{
    --navy-1:#070E22;      /* 배경 최하단 */
    --navy-2:#0C1733;      /* 배경 상단 */
    --navy-ink:#101B38;    /* 카드 위 텍스트 */
    --mist:#AAB6D8;        /* 배경 위 보조 텍스트 */
    --gold-1:#F6C86A;      /* 골드 밝은 쪽 */
    --gold-2:#E0A23B;      /* 골드 어두운 쪽 */
    --gold-soft:#F3D9A4;
    --blue:#1E50FF;        /* 영어독립단어 브랜드 */
    --blue-deep:#1237C0;
    --ok:#2FA97A;
    --radius:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    color:#fff;
    min-height:100dvh;
    background:
      radial-gradient(90% 42% at 50% -6%, rgba(246,200,106,.20) 0%, rgba(246,200,106,0) 60%),
      radial-gradient(120% 70% at 50% 0%, #17264D 0%, rgba(23,38,77,0) 62%),
      linear-gradient(180deg, var(--navy-2) 0%, var(--navy-1) 100%);
    background-attachment:fixed;
    display:flex;justify-content:center;
    padding:22px 16px calc(24px + env(safe-area-inset-bottom));
    line-height:1.5;
  }
  .wrap{width:100%;max-width:420px;position:relative}

  .logo{display:flex;justify-content:center;margin:2px 0 16px}
  .logo img{height:20px;width:auto;opacity:.95}

  .eyebrow{
    text-align:center;font-size:12px;font-weight:800;letter-spacing:.22em;
    color:var(--gold-1);margin:0 0 8px;
  }
  h1{text-align:center;font-size:clamp(22px,6.4vw,27px);font-weight:800;margin:0 0 10px;letter-spacing:-.01em;line-height:1.3;
     text-shadow:0 2px 18px rgba(246,200,106,.18)}
  .sub{text-align:center;color:var(--mist);font-size:clamp(13.5px,3.9vw,15px);font-weight:600;margin:0 0 18px;line-height:1.65}

  /* 브릿지: 선물 권한 안내 */
  .bridge{
    text-align:center;border-radius:16px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(246,200,106,.35);
    padding:14px 16px;margin:0 0 16px;
  }
  .bridge b{display:block;font-size:15.5px;font-weight:800;margin-bottom:5px;color:var(--gold-soft)}
  .bridge p{margin:0;font-size:13px;color:var(--mist);font-weight:600;line-height:1.6}

  /* 선물 티켓 카드 (밝은 카드 on 네이비) */
  .group{
    position:relative;border-radius:var(--radius);
    background:linear-gradient(170deg,#FFFDF7 0%, #F6EFDF 100%);
    color:var(--navy-ink);
    box-shadow:0 22px 50px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.9);
    padding:18px 16px 16px;margin:0 0 14px;overflow:hidden;
  }
  .group::before{ /* 티켓 상단 브랜드 라인 */
    content:"";position:absolute;left:0;top:0;right:0;height:5px;
    background:linear-gradient(90deg,var(--gold-1),var(--gold-2));
  }
  .group--voca{background:linear-gradient(170deg,#FBFCFF 0%, #EDF2FF 100%)}
  .group--voca::before{background:linear-gradient(90deg,#5B7CFF,var(--blue))}

  .group__brand{display:flex;align-items:center;gap:7px;margin:2px 0 8px}
  .group__brand img,.group__brand svg{height:15px;width:auto;display:block}
  .group__brand .txt{font-size:12px;font-weight:800;letter-spacing:.02em;color:#3A4770}
  .group--voca .group__brand .txt{color:var(--blue-deep)}

  .group__head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .group__emoji{font-size:22px;line-height:1}
  .group__title{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .group__count{
    margin-left:auto;flex:0 0 auto;
    font-size:11.5px;font-weight:800;color:var(--navy-ink);
    background:linear-gradient(90deg,var(--gold-1),var(--gold-2));
    border-radius:999px;padding:4px 11px;
  }
  .group--voca .group__count{background:var(--blue);color:#fff}
  .group__desc{font-size:13px;color:#5A648A;font-weight:600;margin:0 0 12px}

  .btn{
    position:relative;display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;border:none;border-radius:13px;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:800;padding:14px 16px;
    transition:transform .08s ease,filter .15s ease;margin-bottom:8px;line-height:1.3;
  }
  .btn:last-of-type{margin-bottom:0}
  .btn:active{transform:scale(.985)}
  .btn:focus-visible{outline:3px solid rgba(30,80,255,.45);outline-offset:2px}
  .btn--class{
    background:linear-gradient(90deg,var(--gold-1),var(--gold-2));
    color:var(--navy-ink);
    box-shadow:0 8px 20px rgba(224,162,59,.38);
  }
  .btn--voca{
    background:linear-gradient(90deg,#3E66FF,var(--blue));
    color:#fff;
    box-shadow:0 8px 20px rgba(30,80,255,.35);
  }
  .btn--kakao{background:#FEE500;color:#191919;box-shadow:0 8px 20px rgba(254,229,0,.22)}
  .btn .kk{width:22px;height:22px;border-radius:5px;flex:0 0 auto;display:block}
  .btn--link{background:transparent;color:#7A83A6;font-size:12.5px;font-weight:700;padding:4px 8px 10px;margin:-4px 0 4px;box-shadow:none;text-decoration:underline;text-underline-offset:3px}
  .btn--link.is-done{color:var(--ok)}
  .btn .ic{display:flex}
  .btn .ic svg{width:18px;height:18px}
  .btn.is-done{background:var(--ok);color:#fff;box-shadow:0 8px 18px rgba(47,169,122,.35)}

  .hint{font-size:12px;color:#7A83A6;font-weight:600;text-align:center;margin:10px 0 0}

  /* 유효기간 */
  .count{
    display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    border-radius:14px;padding:11px 16px;margin:4px 0 0;
  }
  .count .lbl{font-size:12.5px;color:var(--mist);font-weight:700}
  .count .time{font-weight:800;font-size:clamp(15px,4.4vw,17px);color:var(--gold-1);font-variant-numeric:tabular-nums}
  .count .until{flex-basis:100%;text-align:center;font-size:12px;color:var(--mist);font-weight:600;margin-top:2px}

  .note{text-align:center;color:#6E7BA3;font-size:12px;font-weight:500;margin:16px 6px 0;line-height:1.7}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:var(--navy-ink);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:10;max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
  @media (prefers-reduced-motion:reduce){.btn,.toast{transition:none} #confetti{display:none}}
</style>
</head>

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
<script>
  /* ===================== 설정 ===================== */
  const CONFIG = {
    reBase: "https://studianclass.github.io/re/",   // 수신자 화면 주소
    kakaoJsKey: "YOUR_KAKAO_JAVASCRIPT_KEY",        // developers.kakao.com > 앱 > 앱 키 > JavaScript 키
    shareImage: "https://studianclass.github.io/re/og-gift.png",  // 카톡 공유 카드 이미지 (1200x630)
    logUrl: "https://script.google.com/macros/s/AKfycbwgVAt2cm3Xw7oWJ5Nu6w7vN7zdGf-O4jU8TwqJgqX1Ysk7SMu9ChrjAYbO5pYchUIqIQ/exec",  // 클릭 기록 Apps Script 웹앱 URL
    sample: { c1:"CLASS111AAAA", c2:"CLASS222BBBB" },  // 테스트용
    deadlineISO: "2026-12-31T23:59:59+09:00"
  };
  /* =============================================== */

  const params = new URLSearchParams(location.search);
  const clean  = s => (s||"").trim().toUpperCase().replace(/\s+/g,"");
  /* k=인강1.인강2.단어 (점으로 구분) 우선, 없으면 이전 형식 c1/c2/v, 그마저 없으면 샘플 */
  const kParts = (params.get("k")||"").split(".").map(clean);
  const CODES = {
    c1: kParts[0] || clean(params.get("c1")) || CONFIG.sample.c1,
    c2: kParts[1] || clean(params.get("c2")) || CONFIG.sample.c2
  };

  function resolveDeadline(){
    const raw = (params.get("e") || params.get("exp") || "").trim().replace(/[.\/]/g,"-");
    const m = raw.match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
    if(m){
      const t = new Date(m[1]+"-"+m[2]+"-"+m[3]+"T23:59:59+09:00").getTime();
      if(!isNaN(t)) return { ts:t, y:+m[1], mo:+m[2], d:+m[3], raw:m[1]+m[2]+m[3] };
    }
    const fb = CONFIG.deadlineISO;
    return { ts:new Date(fb).getTime(), y:+fb.slice(0,4), mo:+fb.slice(5,7), d:+fb.slice(8,10),
             raw:fb.slice(0,4)+fb.slice(5,7)+fb.slice(8,10) };
  }
  const DL = resolveDeadline();
  const WEEK = ["일","월","화","수","목","금","토"];
  const expLabel = DL.mo+"/"+DL.d+"("+WEEK[new Date(Date.UTC(DL.y,DL.mo-1,DL.d)).getUTCDay()]+") 23:59까지";

  function logEvent(button, code, type, method){
    if(!CONFIG.logUrl) return;
    const payload = JSON.stringify({ page:"owner", button, code, type, method:(method||""), exp:expLabel, ts:new Date().toISOString(), ua:navigator.userAgent });
    try{
      const blob = new Blob([payload], {type:"text/plain;charset=UTF-8"});
      if(navigator.sendBeacon && navigator.sendBeacon(CONFIG.logUrl, blob)) return;
    }catch(e){}
    try{ fetch(CONFIG.logUrl, {method:"POST", mode:"no-cors", keepalive:true, headers:{"Content-Type":"text/plain;charset=UTF-8"}, body:payload}); }catch(e){}
  }
  logEvent("page_view", CODES.c1 + "." + CODES.c2, "class20");  // 어떤 쿠폰쌍의 완강자가 열었는지 기록

  function giftLink(code, isVoca){
    let url = CONFIG.reBase + "?c=" + encodeURIComponent(code) + "&e=" + DL.raw;
    if(isVoca) url += "&t=v";
    return url;
  }

  async function copyText(text){
    try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
    try{
      const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly","");
      ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);
      const ok=document.execCommand("copy"); document.body.removeChild(ta); return ok;
    }catch(e){ return false; }
  }

  const toast = document.getElementById("toast");
  let toastTimer;
  function showToast(msg){
    toast.textContent = msg; toast.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>toast.classList.remove("show"), 2200);
  }

  /* ── 카카오 SDK 초기화 (키가 없으면 링크 복사로 자동 대체) ── */
  let kakaoReady = false;
  try{
    if(window.Kakao && CONFIG.kakaoJsKey && CONFIG.kakaoJsKey !== "YOUR_KAKAO_JAVASCRIPT_KEY"){
      if(!Kakao.isInitialized()) Kakao.init(CONFIG.kakaoJsKey);
      kakaoReady = Kakao.isInitialized();
    }
  }catch(e){ kakaoReady = false; }

  function kakaoShare(url){
    Kakao.Share.sendDefault({
      objectType: "feed",
      content: {
        title: "완강 기념 선물이 도착했어요 🎁",
        description: "스터디언 클래스 영어회화 강의 20% 할인 쿠폰 · " + expLabel,
        imageUrl: CONFIG.shareImage,
        imageWidth: 1200, imageHeight: 630,
        link: { mobileWebUrl: url, webUrl: url }
      },
      buttons: [{ title: "선물 열어보기", link: { mobileWebUrl: url, webUrl: url } }]
    });
  }

  function markDone(btn, label){
    btn.classList.add("is-done");
    btn.firstChild.textContent = label + " ";
  }

  function bindGift(btnId, linkId, code, isVoca, key, type){
    const btn = document.getElementById(btnId);
    const lnk = document.getElementById(linkId);
    const url = giftLink(code, isVoca);

    btn.addEventListener("click", async ()=>{
      try{ localStorage.setItem("sent_" + code, "1"); }catch(e){}
      if(kakaoReady){
        logEvent(key, code, type, "kakao");
        try{ kakaoShare(url); markDone(btn, "카카오톡으로 공유했어요 ✓"); return; }catch(e){}
      }
      /* SDK 없음/실패 → 링크 복사로 대체 */
      logEvent(key, code, type, "copy");
      const ok = await copyText(url);
      if(ok){ markDone(btn, "선물 링크 복사 완료 "); showToast("선물 링크가 복사됐어요. 카톡에 붙여넣기 하세요 🎁"); }
      else showToast("복사에 실패했어요. 다시 눌러 주세요");
    });

    lnk.addEventListener("click", async ()=>{
      logEvent(key, code, type, "copy");
      try{ localStorage.setItem("sent_" + code, "1"); }catch(e){}
      const ok = await copyText(url);
      if(ok){ lnk.classList.add("is-done"); lnk.textContent = "링크 복사 완료 ✓ 카톡에 붙여넣어 주세요"; showToast("선물 링크가 복사됐어요 🎁"); }
      else showToast("복사에 실패했어요. 다시 눌러 주세요");
    });
  }
  bindGift("giftC1", "linkC1", CODES.c1, false, "gift_c1", "class20");
  bindGift("giftC2", "linkC2", CODES.c2, false, "gift_c2", "class20");

  const timeEl = document.getElementById("time");
  document.getElementById("until").textContent = "유효기간 · " + expLabel + " (한국시간)";
  const pad = n => String(n).padStart(2,"0");
  function tick(){
    let diff = DL.ts - Date.now();
    if(diff <= 0){ timeEl.textContent = "선물 기간이 종료되었습니다"; if(timer) clearInterval(timer); return; }
    const d = Math.floor(diff/86400000); diff -= d*86400000;
    const h = Math.floor(diff/3600000);  diff -= h*3600000;
    const m = Math.floor(diff/60000);    diff -= m*60000;
    const s = Math.floor(diff/1000);
    timeEl.textContent = d+"일 "+pad(h)+"시간 "+pad(m)+"분 "+pad(s)+"초";
  }
  let timer = null;
  tick();
  timer = setInterval(tick, 1000);

  /* ── 축하 콘페티: 골드·화이트·블루 (약 2.6초) ── */
  (function(){
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
    let W,H; const resize=()=>{W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;};
    resize(); addEventListener("resize", resize);
    const colors=["#F6C86A","#E0A23B","#FFFFFF","#F3D9A4"];
    const P=[]; const N=95;
    for(let i=0;i<N;i++){
      P.push({x:Math.random()*W, y:-Math.random()*H*.4, r:(4+Math.random()*5)*devicePixelRatio,
              c:colors[i%colors.length], vy:(1.6+Math.random()*2.4)*devicePixelRatio,
              vx:(Math.random()-.5)*1.4*devicePixelRatio, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.2});
    }
    const t0 = performance.now();
    function frame(t){
      const el = t - t0;
      ctx.clearRect(0,0,W,H);
      const fade = el>1900 ? Math.max(0, 1-(el-1900)/700) : 1;
      ctx.globalAlpha = fade;
      for(const p of P){
        p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);
        ctx.restore();
      }
      if(el<2600) requestAnimationFrame(frame);
      else ctx.clearRect(0,0,W,H);
    }
    requestAnimationFrame(frame);
  })();
</script>
